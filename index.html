<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آکادمی آوین | آموزش خصوصی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #1a0f00 50%, #2d1a00 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }

        .avin-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 215, 0, 0.03);
            backdrop-filter: blur(10px);
            border: 2px solid;
            border-image: linear-gradient(45deg, #ffd700, #ffb347, #ff8c00, #ffd700) 1;
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            margin: 20px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ffb347, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .logo-sub {
            font-size: 1.5rem;
            color: #ffb347;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #ffb347;
            font-size: 1.2rem;
            position: relative;
            display: inline-block;
        }

        .subtitle::before, .subtitle::after {
            content: "✦";
            margin: 0 15px;
            color: #ffd700;
            font-size: 1.5rem;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .category-item {
            background: linear-gradient(145deg, #2a1a00, #1a0f00);
            border: 2px solid #ffd700;
            border-radius: 60px;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
            position: relative;
            min-width: 180px;
            text-align: center;
        }

        .category-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
            background: linear-gradient(145deg, #3a2500, #2a1a00);
        }

        .category-item.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0f00;
            border-color: white;
        }

        .dropdown-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            margin-right: 10px;
        }

        .category-item.active .dropdown-icon {
            transform: rotate(180deg);
        }

        .main-dropdown {
            background: linear-gradient(145deg, #2a1a00, #1a0f00);
            border: 2px solid #ffd700;
            border-radius: 30px;
            margin-top: 15px;
            padding: 20px;
            display: none;
            animation: slideDown 0.3s ease;
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.3);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-dropdown.show {
            display: block;
        }

        .menu-level-1 {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .level-1-item {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #ffd700;
        }

        .level-1-title {
            color: #ffd700;
            font-size: 1.3rem;
            font-weight: 700;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffd700;
            margin-bottom: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-1-title:hover {
            transform: scale(1.05);
            color: #ff8c00;
        }

        .level-1-title i {
            margin-left: 10px;
            font-size: 1rem;
            transition: transform 0.3s ease;
        }

        .level-1-title.active i {
            transform: rotate(180deg);
        }

        .menu-level-2 {
            display: none;
            margin-top: 15px;
            padding-right: 15px;
            animation: fadeIn 0.3s ease;
        }

        .menu-level-2.show {
            display: block;
        }

        .level-2-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }

        .level-2-title {
            color: #ffb347;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 8px;
            border-radius: 10px;
            background: linear-gradient(145deg, #3a2500, #2a1a00);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .level-2-title:hover {
            transform: translateX(-5px);
            border-color: #ffd700;
            color: #ffd700;
        }

        .level-2-title i {
            margin-left: 8px;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .level-2-title.active i {
            transform: rotate(180deg);
        }

        .menu-level-3 {
            display: none;
            margin-top: 10px;
            padding-right: 15px;
            animation: fadeIn 0.3s ease;
        }

        .menu-level-3.show {
            display: block;
        }

        .course-item {
            background: linear-gradient(145deg, #3a2500, #2a1a00);
            border-radius: 12px;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;
        }

        .course-item:hover {
            transform: translateX(-5px);
            border-color: #ffd700;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .course-name {
            color: #ffd700;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .course-price {
            color: #ff8c00;
            font-weight: 900;
            font-size: 0.95rem;
        }

        .course-type {
            color: #ffb347;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .reserve-small-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            color: #1a0f00;
            padding: 4px 12px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #ffd700;
            width: 100%;
        }

        .reserve-small-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px #ffd700;
        }

        .offer-section {
            background: linear-gradient(135deg, #2a1a00, #1a0f00);
            border-radius: 30px;
            padding: 40px 30px;
            margin: 40px 0;
            border: 3px solid #ffd700;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .offer-section::before {
            content: "🎁🎁🎁";
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            font-size: 5rem;
            opacity: 0.1;
            transform: rotate(-5deg);
            white-space: nowrap;
        }

        .offer-title {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            position: relative;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .offer-checklist {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 30px;
            padding: 30px;
            margin: 20px 0;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            padding: 15px 25px;
            background: linear-gradient(145deg, #3a2500, #2a1a00);
            border-radius: 50px;
            border: 1px solid #ffd700;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            color: #ffb347;
            text-align: right;
        }

        .check-item:hover {
            transform: translateX(-10px) scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
            background: linear-gradient(145deg, #4a3500, #3a2500);
        }

        .check-icon {
            font-size: 2rem;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a0f00;
            font-weight: 900;
            flex-shrink: 0;
        }

        .check-text {
            line-height: 1.6;
        }

        .highlight {
            color: #ffd700;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .special-gift {
            background: linear-gradient(145deg, #4a3500, #3a2500);
            border: 2px solid #ffd700;
            border-radius: 30px;
            padding: 30px 25px;
            margin: 30px 0 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.3);
        }

        .special-gift::before {
            content: "👥🎁";
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 8rem;
            opacity: 0.08;
            transform: rotate(-10deg);
            white-space: nowrap;
        }

        .gift-title {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            position: relative;
        }

        .gift-description {
            font-size: 1.4rem;
            color: #ffb347;
            line-height: 2;
            position: relative;
        }

        .gift-highlight {
            color: #ffd700;
            font-weight: 900;
            font-size: 1.8rem;
            background: linear-gradient(145deg, #2a1a00, #1a0f00);
            padding: 10px 30px;
            border-radius: 60px;
            display: inline-block;
            margin: 15px 0 10px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .gift-note {
            font-size: 1.2rem;
            color: #ffb347;
            margin-top: 20px;
            font-style: italic;
        }

        .offer-message {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffd700;
            margin: 30px 0 20px;
            text-shadow: 0 0 15px #ff8c00;
        }

        .offer-contact {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a0f00;
            font-size: 2rem;
            font-weight: 900;
            padding: 20px 40px;
            border-radius: 100px;
            display: inline-block;
            margin: 20px 0;
            direction: ltr;
            border: 3px solid white;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
            text-decoration: none;
            cursor: pointer;
        }

        .offer-contact:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.9);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 20px 60px rgba(255, 215, 0, 0.8); }
            100% { transform: scale(1); }
        }

        .offer-footer {
            font-size: 1.3rem;
            color: #ffb347;
            margin-top: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin: 50px 0;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: #ffb347;
            font-size: 1rem;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            flex-wrap: wrap;
            background: linear-gradient(145deg, #2a1a00, #1a0f00);
            padding: 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .contact-item {
            color: #ffb347;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            transition: all 0.3s ease;
            text-decoration: none;
            cursor: pointer;
        }

        .contact-item:hover {
            transform: translateY(-3px);
            border: 1px solid #ffd700;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }

        .contact-item span {
            color: #ffd700;
            font-size: 1.5rem;
        }

        .contact-item .ltr {
            direction: ltr;
            unicode-bidi: embed;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffb347;
        }

        .watermark {
            font-size: 0.9rem;
            color: rgba(255, 215, 0, 0.3);
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .avin-container {
                padding: 20px;
            }
            
            .logo {
                font-size: 3.5rem;
            }
            
            .category-item {
                font-size: 1.2rem;
                padding: 12px 25px;
                min-width: 140px;
            }

            .menu-level-1 {
                flex-direction: column;
            }

            .stats {
                gap: 40px;
            }

            .contact-info {
                padding: 15px;
                gap: 15px;
            }

            .contact-item {
                font-size: 0.9rem;
                padding: 5px 10px;
            }

            .offer-title {
                font-size: 1.8rem;
            }

            .offer-contact {
                font-size: 1.5rem;
                padding: 15px 30px;
            }

            .check-item {
                font-size: 1rem;
                padding: 10px 15px;
            }

            .gift-title {
                font-size: 1.6rem;
            }

            .gift-description {
                font-size: 1.2rem;
            }

            .gift-highlight {
                font-size: 1.5rem;
                padding: 8px 20px;
            }

            .gift-note {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="avin-container">
        <div class="header">
            <div class="logo">آکادمی آوین</div>
            <div class="logo-sub">✨ Avin Academy ✨</div>
            <div class="subtitle">آموزش خصوصی درجه یک</div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">۹۸٪</div>
                <div class="stat-label">رضایت دانش‌آموزان</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">۲۰۰+</div>
                <div class="stat-label">دانش‌آموز موفق</div>
            </div>
        </div>

        <div class="categories">
            <div class="category-item" onclick="toggleMainDropdown('specialized')">
                <span>📐 دروس اختصاصی</span>
                <span class="dropdown-icon">▼</span>
            </div>
            <div class="category-item" onclick="toggleMainDropdown('general')">
                <span>📚 دروس عمومی</span>
                <span class="dropdown-icon">▼</span>
            </div>
            <div class="category-item" onclick="toggleMainDropdown('computer')">
                <span>💻 کامپیوتر</span>
                <span class="dropdown-icon">▼</span>
            </div>
            <div class="category-item" onclick="toggleMainDropdown('english')">
                <span>🇺🇸🇨🇦 آموزش انگلیسی (US & Canada)</span>
                <span class="dropdown-icon">▼</span>
            </div>
            <div class="category-item" onclick="toggleMainDropdown('schoolSubjectsEnglish')">
                <span>🌍 دروس مدرسه به زبان انگلیسی</span>
                <span class="dropdown-icon">▼</span>
            </div>
            <div class="category-item" onclick="toggleMainDropdown('canada')">
                <span>🍁 Canadian School Subjects</span>
                <span class="dropdown-icon">▼</span>
            </div>
        </div>

        <div id="specialized-dropdown" class="main-dropdown">
            <div class="menu-level-1">
                <div class="level-1-item">
                    <div class="level-1-title" onclick="toggleLevel2('math-levels', this)">
                        <span>📐 ریاضیات</span>
                        <i>▼</i>
                    </div>
                    <div id="math-levels" class="menu-level-2">
                        <div class="level-2-item">
                            <div class="level-2-title" onclick="toggleLevel3('primary-math', this)">
                                <span>🔢 دبستان</span>
                                <i>▼</i>
                            </div>
                            <div id="primary-math" class="menu-level-3">
                                <div class="course-item">
                                    <div class="cour
